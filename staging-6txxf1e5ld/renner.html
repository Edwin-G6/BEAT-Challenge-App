<style>

.d.e{border:0;background:transparent;min-height:0}

.mem{display:inline-block;margin-top:10px;padding:5px 10px 4px;border-radius:8px;background:var(--z);color:var(--mute);font:800 11px/1 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase}.mem.yes{background:var(--mint);color:var(--dt)}
.own{background:var(--o);border:1px solid var(--ol);color:var(--ot);border-radius:18px;padding:12px 14px;margin-bottom:16px;font-size:14px;line-height:1.4}

@media (max-width:420px){.grid{gap:5px}.d{min-height:54px;border-radius:10px}.d i{font-size:12px}.card{padding:18px 14px}}

.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.yl{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font:700 11px/1 "JetBrains Mono",monospace;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}.yl span{display:inline-flex;align-items:center;gap:6px}.yl i{width:12px;height:12px;border-radius:3px;display:inline-block}
:root{--c1:#246F65;--c2:#73CFC1;--c3:#F2B84B;--c4:#8794a6}@media (prefers-color-scheme:dark){:root{--c1:#3FA596;--c2:#A6EBE0;--c3:#F2B84B;--c4:#9fb1c4}}
.k .v i,.k .yr i{display:block;font:700 9px/1 "JetBrains Mono",monospace;font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}.k .yr{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font:700 14px/1.1 "JetBrains Mono",monospace}.k .yr small{font-size:10px;color:var(--mute);margin-left:3px}.k.wide .yr{display:none}
</style>

<body>
<div class="w">
  <div class="brand">BEAT <em>Every Day</em></div>
  <div id="app"><div class="card msg">Even laden…</div></div>
  <div class="foot"><a class="btn" href="./">Naar BEAT Every Day</a></div>
</div>
<script>
window.IS_STAGING=/\/staging[-a-z0-9]*(\/|$)/i.test(location.pathname);
const SB_STAGING={url:"https://ijtsrhhovbakxhuvzupw.supabase.co",key:"sb_publishable_NCAyjCkD7syTVKXt9U57zg_x78_MuMw"};
const SB_LIVE={url:"https://gqxkppyvlvssawhqzqhx.supabase.co",key:"sb_publishable_G_rFS8JvGwxBaFpuHcG1Dw_PC_M3ao5"};
const SB=window.IS_STAGING?SB_STAGING:SB_LIVE;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MAANDEN=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const fmt=n=>(Math.round(n*10)/10).toLocaleString("nl-NL",{maximumFractionDigits:1});
const todayNL=()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Amsterdam"});
function say(title,text,img,alt){
  document.title=title+" | BEAT Every Day";
  $("app").innerHTML='<div class="botrow"><div class="bubble"><div class="who">De BED ploegleider</div><p class="say">'+esc(text)+'</p></div><img class="bot" src="bot/'+img+'.webp" alt="'+esc(alt)+'" height="150"></div>';
}
const priv=()=>say("Privé","Sssst… deze renner rijdt incognito. Zijn pagina staat op privé en ik verklap niks 🤫","trots","De BED ploegleider, trots");
const nietGevonden=()=>say("Niet gevonden","Deze renner is niet gevonden.","eigen","De BED ploegleider wijst");
function token(){try{const k="sb-"+new URL(SB.url).hostname.split(".")[0]+"-auth-token";const j=JSON.parse(localStorage.getItem(k)||"null");return j&&j.access_token||null}catch(e){return null}}
function expired(t){try{const j=JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));return !j.exp||j.exp*1000<Date.now()+5000}catch(e){return true}}
const loginNodig=()=>say("Inloggen","Deze pagina is alleen voor ingelogde renners. Log in bij BEAT Every Day en klik daar op de naam van de renner.","zorg","De BED ploegleider");
const CARRY={"Leo-74":1096,"Jesse-777":1096},BSTART="2026-09-01";
/* RIT: per datum de ritten van deze renner {out,in,city,el,hm,km}; wordt gevuld door streakInfo (vanaf BSTART) en histInfo (ervoor) */
const RIT=new Map();
const addRit=(d,o,i,c,e,hm)=>{const x=RIT.get(d)||{out:0,in:0,city:0,el:0,hm:0,km:0};x.out+=o;x.in+=i;x.city+=c;x.el+=e;x.hm+=hm;x.km+=o+i+c+e;RIT.set(d,x)};
async function streakInfo(tk,bib){
  const h={apikey:SB.key,Authorization:"Bearer "+tk},sfx="-"+bib,per=new Map();
  const [e,dd]=await Promise.all([fetch(SB.url+"/rest/v1/entries?select=name,date,km_out,km_in,km_city,km_el,hm&name=like."+encodeURIComponent("*"+sfx),{headers:h}),fetch(SB.url+"/rest/v1/days?select=rows",{headers:h})]);
  if(!e.ok||!dd.ok)throw new Error("streak");
  const E=await e.json(),D=await dd.json(),up=new Set();
  D.forEach(x=>(x.rows||[]).forEach(r=>{if(r[1]&&r[1].endsWith(sfx)&&r[0]>=BSTART){per.set(r[0],(per.get(r[0])||0)+(+r[6]));up.add(r[0]+"|"+r[1]);addRit(r[0],+r[2]||0,+r[3]||0,+r[4]||0,+r[5]||0,+r[7]||0)}}));
  E.forEach(x=>{if(x.name&&x.name.endsWith(sfx)&&x.date>=BSTART){per.set(x.date,(per.get(x.date)||0)+(+x.km_out)+(+x.km_in)+(+x.km_city)+(+x.km_el));if(!up.has(x.date+"|"+x.name))addRit(x.date,+x.km_out||0,+x.km_in||0,+x.km_city||0,+x.km_el||0,+x.hm||0)}});
  let run=0;for(const k in CARRY)if(k.endsWith(sfx))run=CARRY[k];
  let max=run;const today=todayNL();
  for(let d=new Date(BSTART+"T12:00:00Z");;d.setUTCDate(d.getUTCDate()+1)){const s=d.toISOString().slice(0,10);if(s>today)break;
    if(Math.round((per.get(s)||0)*100)/100>=25){run++;if(run>max)max=run}else if(s!==today)run=0}
  return {max,cur:run};
}
/* Ritten van vóór BSTART (tabel entries_hist). Klein en pas na de eerste weergave opgehaald. */
async function histInfo(tk,bib){
  const r=await fetch(SB.url+"/rest/v1/entries_hist?select=date,km_out,km_in,km_city,km_el,hm&name=like."+encodeURIComponent("*-"+bib),{headers:{apikey:SB.key,Authorization:"Bearer "+tk}});
  if(!r.ok){console.warn("Rennerspagina: entries_hist niet te lezen, status "+r.status);return}
  (await r.json()).forEach(x=>{if(x.date<BSTART)addRit(x.date,+x.km_out||0,+x.km_in||0,+x.km_city||0,+x.km_el||0,+x.hm||0)});
}
/* Maanden: de huidige maand komt uit rider_public, eerdere maanden worden hier uit RIT opgebouwd */
let D0=null,VIEW="",READY=false,STREAK='<div class="l">Maximale streak</div><div class="v">…</div>';
const ymAdd=(ym,n)=>{let [y,m]=ym.split("-").map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+String(m).padStart(2,"0")};
function minMonth(){let mn=D0.month;for(const d of RIT.keys()){const k=d.slice(0,7);if(k<mn)mn=k}return mn}
function monthData(ym){
  if(ym===D0.month)return D0;
  const [y,m]=ym.split("-").map(Number),n=new Date(y,m,0).getDate(),days=[],tot={out:0,in:0,city:0,el:0,hm:0};
  for(let i=1;i<=n;i++){const d=ym+"-"+String(i).padStart(2,"0"),x=RIT.get(d);days.push({d,km:x?Math.round(x.km*100)/100:0});if(x){tot.out+=x.out;tot.in+=x.in;tot.city+=x.city;tot.el+=x.el;tot.hm+=x.hm}}
  return {...D0,month:ym,days,tot};
}
function go(n){if(!READY)return;const t=ymAdd(VIEW,n);if(t<minMonth()||t>D0.month)return;VIEW=t;render(monthData(VIEW));const b=$(n<0?"pm":"nm");if(b&&!b.disabled)b.focus();else{const o=$(n<0?"nm":"pm");if(o)o.focus()}}
function msg(t){$("app").innerHTML='<div class="card msg">'+esc(t)+'</div>'}
/* Jaartotalen uit RIT (pas volledig als alle ritten geladen zijn) */
function yearData(y){
  if(!READY)return null;
  const today=todayNL(),M=Array.from({length:12},()=>({out:0,in:0,city:0,el:0})),T={out:0,in:0,city:0,el:0,hm:0},B={km:0,d:""};let g25=0;
  RIT.forEach((x,d)=>{if(d.slice(0,4)!==y)return;const m=M[+d.slice(5,7)-1];m.out+=x.out;m.in+=x.in;m.city+=x.city;m.el+=x.el;T.out+=x.out;T.in+=x.in;T.city+=x.city;T.el+=x.el;T.hm+=x.hm;const k=Math.round(x.km*100)/100;if(k>=25)g25++;if(k>B.km){B.km=k;B.d=d}});
  const end=today<y+"-12-31"?today:y+"-12-31",gone=Math.round((new Date(end+"T12:00:00Z")-new Date(y+"-01-01T12:00:00Z"))/864e5)+1;
  return {M,T,B,g25,gone,tot:T.out+T.in+T.city+T.el,y};
}
/* Tegel met twee getallen: grote regel = gekozen maand, kleine regel = jaar */
const tile2=(l,v1,u,v2,x1,x2,cls,u2)=>'<div class="k'+(cls?" "+cls:"")+'"><div class="l">'+l+'</div><div class="v"><i>'+(tile2.m||"")+'</i>'+v1+'<small>'+u+'</small></div>'+(x1?'<div class="x">'+x1+'</div>':'')+'<div class="yr"><i>'+(tile2.y||"")+'</i>'+v2+(v2!=="…"&&(u2||u)?'<small>'+(u2||u)+'</small>':"")+'</div>'+(x2?'<div class="x">'+x2+'</div>':'')+'</div>';
function cats(d,best,m,Y){
  const t=d.tot;if(!t)return"";
  const T=Y&&Y.T,dl=x=>x&&x.km>0?(+x.d.slice(8))+" "+MAANDEN[+x.d.slice(5,7)-1]:"";
  const q=v=>Y?v:"…";
  return '<h2 class="ch">Totaal per categorie</h2><div class="cat">'+
    tile2("Road Warrior",fmt(t.out),"km",q(T&&fmt(T.out)))+tile2("Zwift Warrior",fmt(t.in),"km",q(T&&fmt(T.in)))+tile2("Stadsfietsbeuker",fmt(t.city),"km",q(T&&fmt(T.city)))+tile2("eBike",fmt(t.el),"km",q(T&&fmt(T.el)))+
    tile2("Bergbaas",Math.round(t.hm).toLocaleString("nl-NL"),"m",q(T&&Math.round(T.hm).toLocaleString("nl-NL")))+
    tile2("Langste dag",fmt(best.km),"km",q(Y&&fmt(Y.B.km)),best.km>0?(+best.d.slice(8))+" "+MAANDEN[m-1]:"",Y?dl(Y.B):"")+'</div>';
}
/* Grafiek: km per maand van het jaar, gestapeld per categorie */
function chartCard(Y){
  if(!Y)return"";
  const {M,y}=Y,fmtk=v=>v<=0?"":v>=1000?(Math.round(v/100)/10).toLocaleString("nl-NL")+"k":String(Math.round(v));
  const mt=M.map(m=>m.out+m.in+m.city+m.el),mx=Math.max(...mt,1);
  const bars=M.map((m,i)=>{const t=mt[i],seg=[["out","c1","Road Warrior"],["in","c2","Zwift Warrior"],["city","c3","Stadsfietsbeuker"],["el","c4","eBike"]].filter(s=>m[s[0]]>0).map(s=>'<i class="'+s[1]+'" style="flex:'+m[s[0]]+' 1 0" title="'+s[2]+': '+fmt(m[s[0]])+' km"></i>').join("");
    return '<div class="yb" role="img" aria-label="'+MAANDEN[i]+': '+fmt(t)+' km"><em>'+fmtk(t)+'</em><div class="ys"><div class="yst" style="height:'+(t/mx*100)+'%">'+seg+'</div></div><span>'+MAANDEN[i][0].toUpperCase()+'</span></div>'}).join("");
  return '<div class="card"><h2 class="ch" style="margin-top:0">Kilometers per maand '+y+'</h2><div class="yc">'+bars+'</div><div class="yl"><span><i class="c1"></i>Road</span><span><i class="c2"></i>Zwift</span><span><i class="c3"></i>Stad</span><span><i class="c4"></i>eBike</span></div></div>';
}
function render(d){
  const [y,m]=d.month.split("-").map(Number),today=todayNL();
  const days=d.days,total=days.reduce((s,x)=>s+x.km,0);
  const gone=days.filter(x=>x.d<=today),ok=gone.filter(x=>x.km>=25).length;
  const best=gone.reduce((b,x)=>x.km>b.km?x:b,{km:0,d:""});
  const first=(new Date(y,m-1,1).getDay()+6)%7,isCur=d.month===D0.month,Y=yearData(String(y));
  tile2.y=String(y);tile2.m=MAANDEN[m-1].slice(0,3);
  document.title=d.name+" | BEAT Every Day";
  let cells=["ma","di","wo","do","vr","za","zo"].map(w=>'<div class="wd">'+w+'</div>').join("")+'<div class="d e"></div>'.repeat(first);
  days.forEach(x=>{
    const n=+x.d.slice(8),fut=x.d>today;
    const c=fut?"f":x.km>=25?"g":x.km>0?"o":"z";
    const lg=best.km>0&&x.d===best.d;
    cells+='<div class="d '+c+(x.d===today?" t":"")+(lg?" l":"")+'" aria-label="'+n+' '+MAANDEN[m-1]+': '+(fut?"nog niet gereden":fmt(x.km)+" km")+(lg?" (langste dag)":"")+'"><b>'+n+'</b><i>'+(fut?"·":x.km>0?fmt(x.km)+"<small>km</small>":"–")+'</i></div>';
  });
  $("app").innerHTML=
   (d.own_private?'<div class="own">🔒 <b>Je pagina staat op privé.</b> Anderen zien alleen een melding. Jij ziet hem nog wel, omdat je bent ingelogd.</div>':'')+
   '<div class="card"><h1>'+esc(d.name)+'</h1><div class="sub">Rugnummer '+d.bib+' · '+MAANDEN[m-1]+' '+y+'</div>'+(d.is_member===true?'<div class="mem yes">BEAT-lid</div>':'')+
   '<div class="kpi">'+tile2("Totaal",fmt(total),"km",Y?fmt(Y.tot):"…")+
   tile2("Dagen met 25 km of meer",ok,"/ "+gone.length,Y?Y.g25:"…","","","",Y?"/ "+Y.gone:"")+
   '<div class="k wide" id="mx">'+STREAK+'</div></div>'+
   cats(d,best,m,Y)+'</div>'+chartCard(Y)+
   '<div class="card"><div class="mh"><h2>'+MAANDEN[m-1]+(y!==+D0.month.slice(0,4)?" "+y:"")+' dag voor dag</h2><div class="nav"><button id="pm" aria-label="Vorige maand"'+(!READY||ymAdd(d.month,-1)<minMonth()?" disabled":"")+'>‹</button><button id="nm" aria-label="Volgende maand"'+(!READY||isCur?" disabled":"")+'>›</button></div></div><div class="leg"><span class="lg">25 km of meer</span><span class="lo">minder dan 25 km</span><span class="lz">0 km</span><span class="ll">langste dag</span></div><div class="grid">'+cells+'</div></div>';
  $("pm").onclick=()=>go(-1);$("nm").onclick=()=>go(1);
}
(async()=>{
  const code=(new URLSearchParams(location.search).get("r")||"").toLowerCase();
  if(!/^[a-z0-9]{6,32}$/.test(code)){nietGevonden();return}
  try{
    const tk=token();if(!tk||expired(tk)){loginNodig();return}
    const r=await fetch(SB.url+"/rest/v1/rpc/rider_public",{method:"POST",headers:{apikey:SB.key,Authorization:"Bearer "+tk,"Content-Type":"application/json"},body:JSON.stringify({p_code:code})});
    if(r.status===401||r.status===403){loginNodig();return}
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    if(!d){nietGevonden();return}
    if(d.login){loginNodig();return}
    if(d.private){priv();return}
    D0=d;VIEW=d.month;render(d);
    const st=streakInfo(tk,d.bib).then(s=>{STREAK='<div class="l">Maximale streak</div><div class="v">'+s.max.toLocaleString("nl-NL")+'<small>dagen</small></div><div class="x">Huidige streak: '+s.cur.toLocaleString("nl-NL")+(s.cur===1?" dag":" dagen")+'</div>';$("mx").innerHTML=STREAK;return true}).catch(()=>{STREAK='<div class="l">Maximale streak</div><div class="v">–</div>';$("mx").innerHTML=STREAK;return false});
    /* Pas na de eerste weergave: oudere ritten ophalen en de maandknoppen aanzetten */
    Promise.all([st,histInfo(tk,d.bib).catch(()=>{})]).then(([ok])=>{if(!ok)return;READY=true;render(monthData(VIEW))});
  }catch(e){msg("De pagina kon niet worden geladen. Probeer het later opnieuw.")}
})();
document.querySelector(".btn").addEventListener("click",e=>{
  /* Kom je uit de app, ga dan terug naar waar je was; anders gewoon naar de app */
  try{const ref=document.referrer&&new URL(document.referrer);if(ref&&ref.origin===location.origin&&ref.pathname.replace(/index\.html$/,"")===new URL("./",location.href).pathname&&history.length>1){e.preventDefault();history.back()}}catch(x){}
});
</script>
