<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>404 – BEAT Every Day</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--ink:#0e1b2c;--mute:#8794a6;--dt:#2a7a74;--mint2:#e3f4f2}
@media (prefers-color-scheme:dark){:root{--bg:#0b1517;--card:#122022;--ink:#e8f1f1;--mute:#8aa3a6;--dt:#5cc0b8;--mint2:#17383a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.45 Outfit,"Avenir Next","Segoe UI",Arial,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center}
.code{font-weight:800;font-size:64px;line-height:1;letter-spacing:.04em;color:var(--dt);margin:0 0 20px}
.bubble{position:relative;background:var(--mint2);border:2.5px solid var(--dt);border-radius:22px;padding:14px 18px;width:100%;box-shadow:0 4px 0 rgba(42,122,116,.18)}
.bubble::before{content:"";position:absolute;bottom:-15px;left:50%;margin-left:-13px;border:13px solid transparent;border-bottom:0;border-top-color:var(--dt)}
.bubble::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:var(--mint2)}
.who{font:700 10px ui-monospace,"JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--dt);margin-bottom:4px}
.say{margin:0;font-size:18px;font-weight:700;line-height:1.3}
.bot{height:190px;max-width:100%;margin-top:22px}
.btn{display:block;margin-top:22px;padding:15px 28px;border-radius:99px;background:var(--dt);color:#fff;font-weight:800;font-size:17px;text-decoration:none}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sub{margin:14px 0 0;font-size:13px;color:var(--mute)}
</style>
<script>
/* Plausible: alleen op live, zoals in de app (niet op /staging...) */
window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)};
plausible.init=plausible.init||function(i){plausible.o=i||{}};
if(!/\/staging[-a-z0-9]*(\/|$)/i.test(location.pathname)){
  var ps=document.createElement("script");ps.async=true;ps.src="https://plausible.io/js/pa-7S4BVQN2dziziJLYpUKIp.js";document.head.appendChild(ps);
  plausible.init();
}
</script>
<script>document.addEventListener('DOMContentLoaded', function () { plausible('404'); });</script>
</head>
<body>
<main>
  <p class="code">404</p>
  <div class="bubble">
    <div class="who">BEAT Every Day</div>
    <p class="say">Deze weg bestaat niet</p>
  </div>
  <img class="bot" src="/bot/zelfspot.webp" alt="De BEAT-bot kijkt zichzelf spottend aan">
  <a class="btn" href="/">Terug naar de app</a>
  <p class="sub">Verkeerde afslag? Geen paniek, iedereen verdwaalt weleens.</p>
</main>
</body>
</html>
